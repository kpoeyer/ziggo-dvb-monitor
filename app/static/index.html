<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ziggo DVB-C Monitor</title><style>
:root{--bg:#07101d;--panel:#101d2e;--line:#263851;--text:#edf5ff;--muted:#90a3b9;--cyan:#35d4c7;--purple:#9f78ff;--red:#ff6b7a;--green:#72e59b;--amber:#ffc55a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% -10%,#1b3453,transparent 35%),var(--bg);color:var(--text);font:14px system-ui,sans-serif}header{padding:30px max(24px,calc((100vw - 1400px)/2));display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:14px;align-items:center}.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--cyan),var(--purple));display:grid;place-items:center;color:#07101d;font-size:23px;font-weight:900}.brand h1{font-size:20px;margin:0}.brand p{color:var(--muted);margin:3px 0 0}.scan{border:0;border-radius:10px;background:var(--cyan);color:#041411;padding:11px 18px;font-weight:750;cursor:pointer}.scan:disabled{opacity:.55}.wrap{max-width:1400px;margin:auto;padding:0 24px 50px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:linear-gradient(145deg,#122136,#0d1929);border:1px solid var(--line);border-radius:14px}.card{padding:18px}.label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.value{font-size:28px;font-weight:750;margin-top:7px}.tabs{display:flex;gap:5px;margin:24px 0 12px}.tab{background:transparent;border:0;color:var(--muted);padding:10px 14px;cursor:pointer;border-radius:8px}.tab.active{background:#172942;color:var(--text)}.panel{overflow:hidden}.toolbar{display:flex;padding:14px;border-bottom:1px solid var(--line);gap:10px}.toolbar input{width:300px;background:#08131f;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:13px 15px;border-bottom:1px solid #1d2d42;white-space:nowrap}th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}tr:hover td{background:#13243a}.num{font-weight:800;color:var(--cyan)}.badge{display:inline-block;border:1px solid var(--line);background:#17283d;padding:3px 7px;border-radius:999px;font-size:12px;margin:1px}.yes{color:var(--green)}.no{color:var(--muted)}.added{color:var(--green)}.removed{color:var(--red)}.changed{color:var(--amber)}.empty{padding:50px;text-align:center;color:var(--muted)}.hide{display:none}.status{font-size:12px;color:var(--muted);margin-right:14px}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}header{padding:20px}.wrap{padding:0 14px}.brand p{display:none}.toolbar input{width:100%}}
</style></head><body><header><div class="brand"><div class="logo">Z</div><div><h1>Ziggo DVB-C Monitor</h1><p>Service-informatie, zenderaanbod en wijzigingshistorie</p></div></div><div><span class="status" id="status"></span><button class="scan" id="scan">Nu scannen</button></div></header><main class="wrap"><section class="stats"><div class="card"><div class="label">Actieve zenders</div><div class="value" id="total">–</div></div><div class="card"><div class="label">Met teletekst</div><div class="value" id="ttx">–</div></div><div class="card"><div class="label">Met ondertiteling</div><div class="value" id="subs">–</div></div><div class="card"><div class="label">Wijzigingen</div><div class="value" id="changes">–</div></div></section><div class="tabs"><button class="tab active" data-page="services">Zenders</button><button class="tab" data-page="changes">Wijzigingen</button><button class="tab" data-page="runs">Scans</button></div><section class="panel"><div class="toolbar" id="toolbar"><input id="search" placeholder="Zoek zender, nummer of provider…"></div><div class="tablewrap" id="content"></div></section></main>
<script>
let data={services:[],changes:[],runs:[]}, page='services';const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const list=x=>x?.length?x.map(v=>`<span class="badge">${esc(v.language||v.lang||'PID '+(v.pid??'?'))}</span>`).join(''):'<span class="no">–</span>';const val=x=>typeof x==='object'?JSON.stringify(x):String(x??'–');
async function load(){let [d,c]=await Promise.all([fetch('/api/dashboard').then(r=>r.json()),fetch('/api/config').then(r=>r.json())]);data=d;document.querySelector('#total').textContent=d.services.length;document.querySelector('#ttx').textContent=d.services.filter(x=>x.teletext.length).length;document.querySelector('#subs').textContent=d.services.filter(x=>x.subtitles.length).length;document.querySelector('#changes').textContent=d.changes.length;document.querySelector('#status').textContent=`Adapter ${c.adapter} · elke ${c.interval_minutes} min.`;render()}
function render(){let q=document.querySelector('#search').value.toLowerCase(), h='';document.querySelector('#toolbar').classList.toggle('hide',page!=='services');if(page==='services'){let rows=data.services.filter(x=>[x.name,x.provider,x.channel_number].join(' ').toLowerCase().includes(q));h=`<table><thead><tr><th>Nr.</th><th>Zender</th><th>Provider</th><th>Teletekst</th><th>Ondertiteling</th><th>Audio</th><th>Frequentie</th><th>CA</th></tr></thead><tbody>${rows.map(x=>`<tr><td class="num">${esc(x.channel_number??'–')}</td><td><strong>${esc(x.name)}</strong><br><span class="no">SID ${esc(x.service_id)}</span></td><td>${esc(x.provider||'–')}</td><td>${list(x.teletext)}</td><td>${list(x.subtitles)}</td><td>${list(x.audio)}</td><td>${x.frequency?esc((x.frequency/1e6).toFixed(3))+' MHz':'–'}</td><td class="${x.encrypted?'changed':'yes'}">${x.encrypted?'Versleuteld':'FTA'}</td></tr>`).join('')}</tbody></table>`}else if(page==='changes'){h=`<table><thead><tr><th>Tijd</th><th>Zender</th><th>Type</th><th>Onderdeel</th><th>Oud</th><th>Nieuw</th></tr></thead><tbody>${data.changes.map(x=>`<tr><td>${esc(new Date(x.created_at).toLocaleString('nl-NL'))}</td><td><strong>${esc(x.service_name)}</strong></td><td class="${esc(x.kind)}">${esc({added:'Toegevoegd',removed:'Verdwenen',changed:'Gewijzigd'}[x.kind]||x.kind)}</td><td>${esc(x.field||'–')}</td><td>${esc(val(x.old_value))}</td><td>${esc(val(x.new_value))}</td></tr>`).join('')}</tbody></table>`}else{h=`<table><thead><tr><th>Scan</th><th>Gestart</th><th>Status</th><th>Zenders</th><th>Melding</th></tr></thead><tbody>${data.runs.map(x=>`<tr><td>#${x.id}</td><td>${esc(new Date(x.started_at).toLocaleString('nl-NL'))}</td><td class="${x.status==='success'?'yes':x.status==='failed'?'removed':''}">${esc(x.status)}</td><td>${x.service_count}</td><td>${esc(x.message||'–')}</td></tr>`).join('')}</tbody></table>`}document.querySelector('#content').innerHTML=h||'<div class="empty">Nog geen gegevens. Start de eerste scan.</div>'}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelector('.tab.active').classList.remove('active');b.classList.add('active');page=b.dataset.page;render()});document.querySelector('#search').oninput=render;document.querySelector('#scan').onclick=async e=>{e.target.disabled=true;e.target.textContent='Scannen…';try{let r=await fetch('/api/scans',{method:'POST'});if(!r.ok)throw Error((await r.json()).detail);await load()}catch(x){alert(x.message)}finally{e.target.disabled=false;e.target.textContent='Nu scannen'}};load().catch(e=>document.querySelector('#content').innerHTML='<div class="empty">Kan gegevens niet laden.</div>');setInterval(load,30000);
</script></body></html>
